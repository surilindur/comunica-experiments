name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - results/**
      - processing/**
  pull_request:
    branches:
      - main
    paths-ignore:
      - results/**
      - processing/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_NODE_VERSION: 26.x

jobs:
  validate:
    name: Validate ${{ matrix.experiment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        experiment:
          - ltqp-solid-bloom-filters
          - ltqp-solid-default
          - ltqp-solid-join-restart
          - wikidata-graph-split
    steps:
      - name: Use Node.js ${{ env.DEFAULT_NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.DEFAULT_NODE_VERSION }}
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-optional
      - name: Validate experiment
        run: yarn run validate
        working-directory: experiments/${{ matrix.experiment }}
